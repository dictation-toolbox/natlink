site_name: natlink
site_description: Python interface to Dragon NaturallySpeaking
repo_url: https://github.com/dictation-toolbox/natlink
docs_dir: docs
site_dir: site

theme:
  name: mkdocs

markdown_extensions:
  - admonition
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            filters:
              - "!^_"
            heading_level: 2
            members_order: source
            separate_signature: true
            show_root_heading: false
            show_root_toc_entry: false
            show_signature_annotations: true
            show_source: false

nav:
  - Getting Started:
      - Overview: index.md
      - Install: install.md
      - Configuration Overview: configuration/index.md
  - Operations:
      - CLI Reference: cli.md
      - Troubleshooting: troubleshooting.md
      - FAQ: faq.md
      - Technical Limitations: technical-limitations.md
  - Integrating:
      - Integration Guide: third_party/index.md
      - API Reference:
          - Dragon API: third_party/api/dragon.md
          - Loader API: third_party/api/loaders.md
          - UI API: third_party/api/ui.md
  - Contributing:
      - Contributing: contributing.md
      - Testing: testing.md
      - Developer Debugging: developer-debugging.md
  - Internals:
      - Architecture: architecture.md
      - Program Flow: program_flow.md
      - Project Structure: structure.md
      - Grammar Compiler: grammar-compiler.md
  - Deep Reference:
      - Settings Reference: configuration/settings.md
      - Logging Reference: configuration/logging.md
      - Grammar Binary Format: grammar_binary_format.md
