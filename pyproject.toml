[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "natlink"
version = "6.0.0"
description = "Python interface to Dragon NaturallySpeaking — no admin required"
license = "GPL-2.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "comtypes >= 1.2",
    "lark >= 1.1",
]
authors = [{name = "Joel Gould"}]
classifiers=[
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules"
    ]

[project.urls]
Home = "https://github.com/dictation-toolbox/natlink"
Documentation = "https://natlink.readthedocs.io/en/latest/"
Source = "https://github.com/dictation-toolbox/natlink"

[project.optional-dependencies]
dev = [
    "natlinkcore >= 5.4",
    "dtactions >= 1.5",
    "pytest >=9.0.2",
    "pytest-cov >=6.0",
    "black >= 24.0",
    "import-linter >= 2.0",
    "mkdocs >= 1.6, < 2",
    "mkdocstrings[python] >= 1.0",
    "pyenvutils",
]

[project.entry-points."natlink.ui_provider"]
default = "natlink_ui:UIProvider"

[project.scripts]
natlink = "natlink_compat._cli:main"

[project.gui-scripts]
natlink-ui = "natlink_ui:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
natlink_com = ["*.dll"]
natlink_ui = ["icons/*.ico"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["natlink*", "natlink_com*", "natlink_compat*", "natlink_ui*"]

[tool.pytest.ini_options]
minversion = "9.0.2"
addopts = "--capture=tee-sys --cov --cov-report=term-missing:skip-covered"
markers = [
    "online: tests that require a live Dragon connection (auto-skipped otherwise)",
    "offline: tests that require Dragon NOT running (auto-skipped otherwise)",
    "minimal: fast regression guard — one test per feature (<30s)",
    "experimental: slow or unreliable tests — run with: pytest -m experimental",
    "nsformat: Dragon text formatting tests — run with: pytest -m nsformat",
    "teardown: disconnects the shared session, forcing a costly reconnect — run with: pytest -m teardown",
]
pythonpath = [
    "src",
    "tests",
]
testpaths = [
    "tests",
]
python_files = [
    "unittest*.py",
    "test_*.py",
]

[tool.coverage.run]
source = ["natlink", "natlink_com", "natlink_compat", "natlink_ui"]
omit = [
    "*/natlink_com/_dspeech_constants.py",
    "*/natlink_com/_speech_constants.py",
    "*/natlink_com/_guids.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[tool.importlinter]
root_packages = ["natlink_com", "natlink_compat", "natlink_ui"]

[[tool.importlinter.contracts]]
name = "Three-layer direction (com does not import compat or ui; compat does not import ui)"
type = "layers"
layers = [
    "natlink_ui",
    "natlink_compat",
    "natlink_com",
]
ignore_imports = [
    # Dev-only fallback when running from a source checkout without entry-point registration.
    # Production installs discover UIProvider via `natlink.ui_provider` entry point.
    "natlink_compat._launcher -> natlink_ui",
]
